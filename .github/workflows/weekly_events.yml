name: Weekly CERN events

on:
  schedule:
    # Every Sunday at 07:00 UTC. GitHub often starts this hours late;
    # Sunday still leaves the digest before Monday.
    - cron: "0 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write the PI list
        env:
          PI_LIST: ${{ secrets.PI_LIST }}
        run: |
          if [ -n "$PI_LIST" ]; then
            printf '%s\n' "$PI_LIST" > PI_list.csv
          fi

      - name: Send the weekly digest
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INDICO_API_TOKEN: ${{ secrets.INDICO_API_TOKEN }}
        run: python notifier.py
